<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>七賢單字對戰</title>
<meta name="description" content="七賢英語 1 vs 1 單字對戰：掃 QR code 用手機或平板對戰，一輪 5 題">
<link rel="stylesheet" href="style.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
</head>
<body class="bt">
<header class="top" id="hdr">
  <div class="wrap row">
    <div><h1>⚔️ 七賢單字對戰</h1><p id="sub">1 vs 1｜一輪 5 題｜答對越快分數越高</p></div>
    <a class="btn ghost" href="index.html">📖 回教材</a>
  </div>
</header>
<main class="wrap" id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="vocab.js?v=2"></script>
<script src="data.js?v=2"></script>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const U = window.UNITS, L = 'ABCD', N = 5, TIME = 15, PREFIX = 'qixian-en-';
const params = new URLSearchParams(location.search);
const clampUnit = n => Math.min(U.length, Math.max(1, n || 1)) - 1;

let unit = clampUnit(+params.get('u'));
let peer = null, conn = null;
let G = null;          // 目前這一局的狀態
let timerId = null;

function unitOptions(sel){
  return U.map((u,i)=>`<option value="${i}" ${i===sel?'selected':''}>Unit ${u.id}｜${u.book} ${u.lessons}｜${esc(u.title)}</option>`).join('');
}
function qrSvg(text){ const q = qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:5, margin:2, scalable:true}); }

/* 一輪 5 題：4 題出自文章、最後 1 題是單字應用；選項隨機排列 */
function pickQuestions(ui){
  const b = U[ui].battle;
  const list = [...shuffle(b.text).slice(0, N - 1), shuffle(b.apply)[0]];
  return list.map((x, i) => {
    const opts = shuffle(x.o.map((o, k) => ({ o, c: k === 0 })));
    return { q: x.q, o: opts.map(z => z.o), a: opts.findIndex(z => z.c), apply: i === N - 1 };
  });
}
const points = (a, q) => a && a.k === q.a ? 100 + Math.max(0, Math.round((TIME * 1000 - a.ms) / 100)) : 0;

/* ---------- 首頁 ---------- */
function home(msg){
  stopTimer(); closeNet();
  $('#hdr').style.display = '';
  const joinCode = (params.get('join') || '').replace(/\D/g,'');
  if (joinCode) return joinScreen(joinCode);
  app.innerHTML = `
  <div class="card stack">
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label>你的暱稱<input class="field" id="nm" maxlength="10" placeholder="例如：Jay" value="${esc(store.get('qx_name'))}"></label>
    <label>對戰單元<select class="field" id="un">${unitOptions(unit)}</select></label>
  </div>
  <div class="card stack">
    <h3>📱 兩支手機／平板對戰</h3>
    <p class="muted" style="margin:0">你建立房間 → 畫面出現 QR code → 對手用手機掃描就能加入。</p>
    <button class="btn primary" id="host">建立房間</button>
  </div>
  <div class="card stack">
    <h3>🔢 輸入房號加入</h3>
    <input class="field" id="code" inputmode="numeric" maxlength="4" placeholder="4 位數房號">
    <button class="btn" id="join">加入房間</button>
  </div>
  <div class="card stack">
    <h3>🤝 同一台平板面對面對戰</h3>
    <p class="muted" style="margin:0">平板平放桌上，兩人各坐一邊，畫面上下分割各自作答（不需網路連線）。</p>
    <button class="btn" id="local">開始同機對戰</button>
  </div>`;
  const name = () => { const v = $('#nm').value.trim() || '玩家'; store.set('qx_name', v); return v; };
  $('#un').onchange = e => unit = +e.target.value;
  $('#host').onclick = () => hostScreen(name());
  $('#join').onclick = () => { const c = $('#code').value.replace(/\D/g,''); if (c.length === 4) { name(); joinScreen(c); } else $('#code').focus(); };
  $('#local').onclick = () => startLocal();
}

/* ---------- 網路：房主 ---------- */
function hostScreen(myName, tries){
  closeNet();
  const code = String(Math.floor(1000 + Math.random() * 9000));
  app.innerHTML = `<div class="card center stack"><p class="muted">連線中…</p></div>`;
  peer = new Peer(PREFIX + code);
  peer.on('open', () => {
    const url = new URL('battle.html?join=' + code, location.href).href;
    app.innerHTML = `
    <div class="card center stack">
      <div class="muted">Unit ${U[unit].id}｜${esc(U[unit].title)}</div>
      <div style="margin:0 auto;background:#fff;padding:10px;border-radius:12px;line-height:0;width:min(260px,70vw)">${qrSvg(url)}</div>
      <div>房號 <span class="code">${code}</span></div>
      <p class="muted" style="margin:0">請對手用手機相機掃描 QR code，<br>或在首頁輸入房號加入。</p>
      <p id="st">⏳ 等待對手加入…</p>
      <button class="btn" onclick="home()">取消</button>
    </div>`;
  });
  peer.on('connection', c => {
    if (conn && conn.open) { c.on('open', () => { c.send({ t:'full' }); setTimeout(() => c.close(), 300); }); return; }
    conn = c;
    conn.on('data', d => onHostData(d));
    conn.on('close', () => lostOpponent());
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && (tries || 0) < 5) return hostScreen(myName, (tries || 0) + 1);
    home('連線失敗（' + e.type + '）。請確認網路，或改用「同一台平板面對面對戰」。');
  });
  G = { mode:'host', me:'h', op:'g', names:{ h: myName, g: '' } };
}
function onHostData(d){
  if (d.t === 'hello') { G.names.g = d.name || '對手'; hostStartRound(); }
  else if (d.t === 'ans' && d.i === G.i) recordAnswer('g', d.k, d.ms);
  else if (d.t === 'again') hostStartRound();
}

/* ---------- 網路：加入者 ---------- */
function joinScreen(code){
  closeNet();
  const saved = store.get('qx_name');
  if (!saved) {
    app.innerHTML = `<div class="card stack">
      <h3>加入房間 ${esc(code)}</h3>
      <label>你的暱稱<input class="field" id="nm" maxlength="10" placeholder="例如：Amy"></label>
      <button class="btn primary" id="go">加入對戰</button></div>`;
    $('#go').onclick = () => { store.set('qx_name', $('#nm').value.trim() || '玩家'); joinScreen(code); };
    return;
  }
  app.innerHTML = `<div class="card center stack"><p>🔌 正在連線到房間 <b>${esc(code)}</b>…</p>
    <button class="btn" id="rename">改暱稱（目前：${esc(saved)}）</button></div>`;
  $('#rename').onclick = () => { store.set('qx_name',''); joinScreen(code); };
  G = { mode:'guest', me:'g', op:'h', names:{ h:'', g: saved } };
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on('open', () => { conn.send({ t:'hello', name: saved });
      app.innerHTML = `<div class="card center stack"><p class="big">✅ 已連線</p><p class="muted">等待房主開始…</p></div>`; });
    conn.on('data', d => onGuestData(d));
    conn.on('close', () => lostOpponent());
  });
  peer.on('error', e => {
    const why = e.type === 'peer-unavailable' ? '找不到這個房號，請確認房主的畫面還開著。' : '連線失敗（' + e.type + '）。';
    history.replaceState(null, '', 'battle.html');
    params.delete('join');
    home(why);
  });
}
function onGuestData(d){
  if (d.t === 'full') { params.delete('join'); history.replaceState(null,'','battle.html'); home('這個房間已經有人在對戰了。'); }
  else if (d.t === 'start') { Object.assign(G, { unit:d.unit, qs:d.qs, names:{ h:d.names.h, g:G.names.g }, scores:{h:0,g:0}, log:[], i:-1 }); countdown(); }
  else if (d.t === 'q') { G.i = d.i; G.ans = {}; G.revealed = false; showQuestion(); startTimer(null); }
  else if (d.t === 'st') markOpponentAnswered();
  else if (d.t === 'rv') { G.ans = d.ans; G.scores = d.scores; G.log = d.log; G.revealed = true; stopTimer(); showReveal(); }
  else if (d.t === 'end') { G.scores = d.scores; G.log = d.log; showResult(); }
}

function send(m){ if (conn && conn.open) conn.send(m); }
function closeNet(){
  const c = conn, p = peer; conn = null; peer = null;   // 先清空，主動離開時不觸發「對手離線」
  try { c && c.close(); } catch(e){} try { p && p.destroy(); } catch(e){}
}
function lostOpponent(){
  if (!conn) return;
  conn = null;
  stopTimer();
  if (!G || G.mode === 'local') return;
  app.innerHTML = `<div class="card center stack"><p class="big">📴 對手已離線</p><button class="btn primary" onclick="params.delete('join');history.replaceState(null,'','battle.html');home()">回首頁</button></div>`;
}

/* ---------- 房主（與同機模式）的出題流程 ---------- */
function hostStartRound(){
  G.unit = unit; G.qs = pickQuestions(unit); G.scores = { h:0, g:0 }; G.log = []; G.i = -1;
  send({ t:'start', unit, qs:G.qs, names:G.names });
  countdown(() => hostNext());
}
function hostNext(){
  G.i++;
  if (G.i >= N) { send({ t:'end', scores:G.scores, log:G.log }); return showResult(); }
  G.ans = {}; G.revealed = false;
  send({ t:'q', i:G.i });
  showQuestion();
  startTimer(() => hostReveal());
}
function recordAnswer(who, k, ms){
  if (G.revealed || G.ans[who]) return;
  G.ans[who] = { k, ms };
  if (G.mode === 'host' && who === 'g') markOpponentAnswered();
  if (G.mode === 'host' && who === 'h') send({ t:'st' });
  if (G.mode === 'local') markLocalAnswered(who);
  if (G.ans.h && G.ans.g) setTimeout(hostReveal, 350);
}
function hostReveal(){
  if (G.revealed) return;
  G.revealed = true; stopTimer();
  const q = G.qs[G.i], pts = { h: points(G.ans.h, q), g: points(G.ans.g, q) };
  G.scores.h += pts.h; G.scores.g += pts.g;
  G.log.push({ i:G.i, ans:G.ans, pts });
  send({ t:'rv', i:G.i, ans:G.ans, scores:G.scores, log:G.log });
  showReveal();
  setTimeout(hostNext, 2600);
}

/* ---------- 計時 ---------- */
function startTimer(onEnd){
  stopTimer();
  G.t0 = performance.now();
  timerId = setInterval(() => {
    const left = Math.max(0, TIME - (performance.now() - G.t0) / 1000);
    document.querySelectorAll('.timer i').forEach(b => b.style.width = (left / TIME * 100) + '%');
    document.querySelectorAll('.tleft').forEach(b => b.textContent = Math.ceil(left));
    if (left <= 0) { stopTimer(); document.querySelectorAll('.bopts button').forEach(b => b.disabled = true); onEnd && onEnd(); }
  }, 100);
}
function stopTimer(){ if (timerId) clearInterval(timerId); timerId = null; }

function countdown(then){
  let n = 3;
  const draw = () => {
    const html = `<div class="center"><p class="muted">Unit ${U[G.unit].id}｜${esc(U[G.unit].title)}</p><p class="big" style="font-size:72px">${n}</p><p>${esc(G.names.h)} vs ${esc(G.names.g)}</p></div>`;
    if (G.mode === 'local') { $('#hdr').style.display = 'none'; app.innerHTML = `<div class="card" style="margin-top:30vh">${html}</div>`; }
    else app.innerHTML = `<div class="card">${html}</div>`;
  };
  draw();
  const id = setInterval(() => { n--; if (n <= 0) { clearInterval(id); then && then(); } else draw(); }, 1000);
}

/* ---------- 單人畫面（網路對戰） ---------- */
function scoreBar(){
  const me = G.me, op = G.op;
  return `<div class="score">
    <div class="p p1"><div class="n">${esc(G.names[me])}（你）</div><div class="s">${G.scores[me]}</div></div>
    <div class="vs">VS</div>
    <div class="p p2"><div class="n">${esc(G.names[op])}</div><div class="s">${G.scores[op]}</div><div class="st" id="opst"></div></div>
  </div>`;
}
function showQuestion(){
  if (G.mode === 'local') return showSplit();
  const q = G.qs[G.i];
  app.innerHTML = `${scoreBar()}
  <div class="card">
    <div class="qhead"><span>第 ${G.i + 1} / ${N} 題 ${q.apply ? '<span class="apply-tag">單字應用</span>' : '<span class="apply-tag" style="background:var(--brand)">文章</span>'}</span><span>⏱ <span class="tleft">${TIME}</span>s</span></div>
    <div class="timer"><i></i></div>
    <div class="bq">${esc(q.q)}</div>
    <div class="bopts">${q.o.map((o,k)=>`<button data-k="${k}"><b>${L[k]}.</b> ${esc(o)}<span class="who"></span></button>`).join('')}</div>
  </div>`;
  app.querySelectorAll('.bopts button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, ms = Math.round(performance.now() - G.t0);
    app.querySelectorAll('.bopts button').forEach(x => x.disabled = true);
    b.classList.add('pick'); G.myPick = k;
    if (G.mode === 'host') recordAnswer('h', k, ms);
    else { send({ t:'ans', i:G.i, k, ms }); G.ans[G.me] = { k, ms }; }
  });
  G.myPick = null;
}
function markOpponentAnswered(){ const s = $('#opst'); if (s) s.textContent = '✓ 已作答'; }
function showReveal(){
  if (G.mode === 'local') return revealSplit();
  const q = G.qs[G.i];
  app.querySelector('.score').outerHTML = scoreBar();
  const bs = app.querySelectorAll('.bopts button');
  bs.forEach(b => { b.disabled = true; const k = +b.dataset.k;
    if (k === q.a) b.classList.add('right');
    const tags = [];
    if (G.ans[G.me] && G.ans[G.me].k === k) { tags.push('你'); if (k !== q.a) b.classList.add('wrong'); }
    if (G.ans[G.op] && G.ans[G.op].k === k) tags.push('對手');
    b.querySelector('.who').textContent = tags.join('・');
  });
  const last = G.log[G.log.length - 1], p = last ? last.pts[G.me] : 0;
  app.querySelector('.card').insertAdjacentHTML('beforeend',
    `<p class="center ${p ? 'ok' : 'bad'}" style="font-weight:800;margin:12px 0 0">${p ? '答對！ +' + p : (G.ans[G.me] ? '答錯了' : '時間到')}</p>`);
  if (navigator.vibrate) navigator.vibrate(p ? 40 : [60, 40, 60]);
}

/* ---------- 同機分割畫面 ---------- */
function startLocal(){
  closeNet();
  G = { mode:'local', names:{ h:'藍隊', g:'橘隊' } };
  hostStartRound();
}
function half(who){
  const q = G.qs[G.i];
  return `<div class="half ${who === 'g' ? 'flip' : ''}" data-who="${who}">
    <div class="who-lbl">${who === 'h' ? '🔵' : '🟠'} ${G.names[who]}　${G.scores[who]} 分　<span class="lst"></span></div>
    <div class="bq">${esc(q.q)}</div>
    <div class="bopts">${q.o.map((o,k)=>`<button data-k="${k}"><b>${L[k]}.</b> ${esc(o)}</button>`).join('')}</div>
  </div>`;
}
function showSplit(){
  const q = G.qs[G.i];
  app.innerHTML = `<div class="split">${half('g')}
    <div class="mid"><span>第 ${G.i + 1}/${N} 題${q.apply ? '・單字應用' : ''}</span><div class="timer" style="flex:1;margin:0 12px"><i></i></div><span><span class="tleft">${TIME}</span>s</span></div>
    ${half('h')}</div>`;
  app.querySelectorAll('.half').forEach(h => h.querySelectorAll('button').forEach(b => b.onclick = () => {
    h.querySelectorAll('button').forEach(x => x.disabled = true);
    b.classList.add('pick');
    recordAnswer(h.dataset.who, +b.dataset.k, Math.round(performance.now() - G.t0));
  }));
}
function markLocalAnswered(who){ const s = app.querySelector(`.half[data-who="${who}"] .lst`); if (s) s.textContent = '✓ 已作答'; }
function revealSplit(){
  const q = G.qs[G.i], last = G.log[G.log.length - 1];
  app.querySelectorAll('.half').forEach(h => {
    const who = h.dataset.who, a = G.ans[who];
    h.querySelectorAll('button').forEach(b => { b.disabled = true; const k = +b.dataset.k;
      if (k === q.a) b.classList.add('right'); else if (a && a.k === k) b.classList.add('wrong'); });
    h.querySelector('.lst').innerHTML = last.pts[who] ? `<b class="ok">+${last.pts[who]}</b>` : `<b class="bad">${a ? '答錯' : '時間到'}</b>`;
  });
}

/* ---------- 結果 ---------- */
function showResult(){
  stopTimer();
  $('#hdr').style.display = '';
  const s = G.scores, local = G.mode === 'local';
  const me = local ? 'h' : G.me, op = local ? 'g' : G.op;
  let title;
  if (s.h === s.g) title = '🤝 平手！';
  else if (local) title = (s.h > s.g ? '🔵 ' + G.names.h : '🟠 ' + G.names.g) + ' 獲勝！';
  else title = s[me] > s[op] ? '🏆 你贏了！' : '💪 再接再厲！';
  const rows = G.qs.map((q, i) => {
    const lg = G.log.find(x => x.i === i) || { ans:{}, pts:{h:0,g:0} };
    const mark = w => lg.pts[w] ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>';
    return `<li>${esc(q.q.replace('______', '【' + q.o[q.a] + '】'))}<br>
      <small class="muted">${local ? G.names.h : '你'} ${mark(me)}　${local ? G.names.g : G.names[op]} ${mark(op)}</small></li>`;
  }).join('');
  const hostSide = G.mode !== 'guest';
  app.innerHTML = `<div class="card center result stack">
    <div class="trophy">${s.h === s.g ? '🤝' : (local || s[me] > s[op]) ? '🏆' : '🏀'}</div>
    <div class="big">${title}</div>
    <div class="score" style="max-width:420px;margin:0 auto;width:100%">
      <div class="p p1"><div class="n">${esc(G.names[me])}</div><div class="s">${s[me]}</div></div><div class="vs">VS</div>
      <div class="p p2"><div class="n">${esc(G.names[op])}</div><div class="s">${s[op]}</div></div>
    </div>
    <ol class="review">${rows}</ol>
    ${hostSide ? `<label>下一輪單元<select class="field" id="un2">${unitOptions(G.unit)}</select></label>
      <button class="btn primary" id="again">再來一輪</button>` : `<p class="muted">等待房主開始下一輪…</p>`}
    <a class="btn" href="index.html#u${U[G.unit].id}">📖 複習這篇文章</a>
    <button class="btn" id="quit">結束對戰</button>
  </div>`;
  if (hostSide) {
    $('#un2').onchange = e => unit = +e.target.value;
    $('#again').onclick = () => hostStartRound();
  }
  $('#quit').onclick = () => { params.delete('join'); history.replaceState(null, '', 'battle.html?u=' + U[unit].id); home(); };
}

home();
</script>
</body>
</html>
